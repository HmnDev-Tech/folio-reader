[package]
name = "rust_reader_core"
version = "0.1.0"
edition = "2021"
authors = ["HmnDev-Tech"]
description = "High-performance Markdown and LaTeX document parser for Folio Reader"

[lib]
name = "rust_reader_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
jni = { version = "0.21", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = { version = "1.10", default-features = false, features = ["std", "unicode-perl"] }
