<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=3.0, user-scalable=yes">
  <title>Folio Reader</title>
  <!-- KaTeX CSS & JS bundled locally (offline, no network permission needed) -->
  <link rel="stylesheet" href="vendor/katex/katex.min.css">
  <script defer src="vendor/katex/katex.min.js"></script>
  <script defer src="vendor/katex/contrib/auto-render.min.js"></script>
  <!-- Marked Markdown Parser bundled locally -->
  <script src="vendor/marked/marked.min.js"></script>

  <style>
    :root {
      --folio-bg: #FDFBF7;
      --folio-text: #191C1E;
      --folio-primary: #C2673D;
      --folio-code-bg: #F3EFE6;
      --folio-card-bg: rgba(0, 0, 0, 0.03);
      --folio-border: rgba(0, 0, 0, 0.08);
      --folio-font-family: 'Georgia', serif;
      --folio-font-size: 18px;
      --folio-line-height: 1.68;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--folio-bg);
      color: var(--folio-text);
      font-family: var(--folio-font-family);
      font-size: var(--folio-font-size);
      line-height: var(--folio-line-height);
      margin: 0;
      padding: 24px 20px 100px 20px;
      transition: background-color 0.25s ease, color 0.25s ease;
      word-wrap: break-word;
    }

    h1, h2, h3, h4, h5, h6 {
      color: var(--folio-text);
      font-family: system-ui, -apple-system, sans-serif;
      font-weight: 700;
      line-height: 1.25;
      margin-top: 1.6em;
      margin-bottom: 0.6em;
      letter-spacing: -0.02em;
    }

    h1 { font-size: 1.85em; border-bottom: 2px solid var(--folio-border); padding-bottom: 0.3em; }
    h2 { font-size: 1.45em; border-bottom: 1px solid var(--folio-border); padding-bottom: 0.2em; }
    h3 { font-size: 1.25em; }

    p {
      margin-top: 0;
      margin-bottom: 1.2em;
    }

    /* LaTeX Math formula styling */
    .katex-display {
      margin: 1.4em 0 !important;
      padding: 14px 18px !important;
      background: var(--folio-card-bg);
      border-radius: 16px;
      overflow-x: auto;
      overflow-y: hidden;
      border: 1px solid var(--folio-border);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
    }

    .katex {
      font-size: 1.12em !important;
    }

    pre {
      background-color: var(--folio-code-bg);
      border-radius: 14px;
      padding: 16px;
      overflow-x: auto;
      font-family: 'Fira Code', 'Roboto Mono', monospace;
      font-size: 0.88em;
      line-height: 1.45;
      border: 1px solid var(--folio-border);
      margin: 1.4em 0;
    }

    code {
      font-family: 'Fira Code', 'Roboto Mono', monospace;
      background-color: var(--folio-code-bg);
      padding: 2px 6px;
      border-radius: 6px;
      font-size: 0.88em;
    }

    blockquote {
      margin: 1.4em 0;
      padding: 12px 20px;
      border-left: 4px solid var(--folio-primary);
      background: var(--folio-card-bg);
      border-radius: 0 14px 14px 0;
      font-style: italic;
    }

    table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      margin: 1.4em 0;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--folio-border);
    }

    th, td {
      padding: 12px 14px;
      text-align: left;
      border-bottom: 1px solid var(--folio-border);
    }

    th {
      background-color: var(--folio-card-bg);
      font-weight: 600;
    }

    hr {
      border: none;
      height: 1px;
      background: var(--folio-border);
      margin: 2em 0;
    }

    a {
      color: var(--folio-primary);
      text-decoration: none;
    }

    /* Paging Mode Container */
    .paged-view {
      display: flex;
      flex-direction: column;
    }
  </style>
</head>
<body onclick="handleBodyClick(event)">
  <div id="content"></div>

  <script>
    let rawContent = "";

    function setDocument(markdownContent) {
      rawContent = markdownContent;
      render();
    }

    function render() {
      if (typeof marked !== 'undefined') {
        document.getElementById('content').innerHTML = marked.parse(rawContent);
      } else {
        document.getElementById('content').innerText = rawContent;
      }
      renderMath();
    }

    function renderMath() {
      if (typeof renderMathInElement !== 'undefined') {
        renderMathInElement(document.getElementById('content'), {
          delimiters: [
            {left: '$$', right: '$$', display: true},
            {left: '$', right: '$', display: false},
            {left: '\\[', right: '\\]', display: true},
            {left: '\\(', right: '\\)', display: false}
          ],
          throwOnError: false
        });
      }
    }

    function updateTheme(bgColor, textColor, primaryColor, codeBgColor, cardBgColor, borderColor, fontFamily, fontSizeSp, lineHeightRatio) {
      const root = document.documentElement;
      if (bgColor) root.style.setProperty('--folio-bg', bgColor);
      if (textColor) root.style.setProperty('--folio-text', textColor);
      if (primaryColor) root.style.setProperty('--folio-primary', primaryColor);
      if (codeBgColor) root.style.setProperty('--folio-code-bg', codeBgColor);
      if (cardBgColor) root.style.setProperty('--folio-card-bg', cardBgColor);
      if (borderColor) root.style.setProperty('--folio-border', borderColor);
      if (fontFamily) root.style.setProperty('--folio-font-family', fontFamily);
      if (fontSizeSp) root.style.setProperty('--folio-font-size', fontSizeSp + 'px');
      if (lineHeightRatio) root.style.setProperty('--folio-line-height', lineHeightRatio);
    }

    function handleBodyClick(event) {
      // Notify Android Compose layer on document tap to toggle immersive reading mode
      if (window.FolioBridge && window.FolioBridge.onDocumentTapped) {
        window.FolioBridge.onDocumentTapped();
      }
    }

    // Scroll reporting for reading progress
    window.addEventListener('scroll', () => {
      const h = document.documentElement;
      const b = document.body;
      const st = 'scrollTop';
      const sh = 'scrollHeight';
      const percent = (h[st] || b[st]) / ((h[sh] || b[sh]) - h.clientHeight);
      if (window.FolioBridge && window.FolioBridge.onScrollProgress) {
        window.FolioBridge.onScrollProgress(Math.min(1.0, Math.max(0.0, percent || 0)));
      }
    });

    // Auto-render when KaTeX loads
    window.addEventListener('DOMContentLoaded', () => {
      render();
    });
  </script>
</body>
</html>
