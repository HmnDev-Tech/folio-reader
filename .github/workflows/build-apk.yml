name: Build Folio Reader APK

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: apk-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Native Rust Core & Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Run Rust Core Unit Tests
        run: |
          cargo test --manifest-path rust-core/Cargo.toml

      - name: Locate or Install Android NDK
        run: |
          set -euo pipefail
          NDK_PATH=$(ls -d $ANDROID_HOME/ndk/* 2>/dev/null | sort -V | tail -1 || true)
          if [ -z "$NDK_PATH" ] || [ ! -d "$NDK_PATH" ]; then
            SDKMANAGER=$(command -v sdkmanager || ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
            yes | "$SDKMANAGER" --licenses > /dev/null || true
            "$SDKMANAGER" --install "ndk;26.3.11579264" "platforms;android-35" "build-tools;35.0.0"
            NDK_PATH="$ANDROID_HOME/ndk/26.3.11579264"
          fi
          echo "ANDROID_NDK_HOME=$NDK_PATH" >> "$GITHUB_ENV"
          echo "Selected NDK path: $NDK_PATH"

      - name: Build Rust Native JNI Libraries
        run: |
          set -euo pipefail
          cargo install cargo-ndk
          mkdir -p app/src/main/jniLibs
          cd rust-core
          cargo ndk -t arm64-v8a -t x86_64 -o ../app/src/main/jniLibs build --release
          cd ..
          echo "Generated native libraries:"
          find app/src/main/jniLibs -name "*.so"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Android Unit Tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Assemble Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Folio Reader APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: folio-reader-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
